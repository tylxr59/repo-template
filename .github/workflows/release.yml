name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v* tag to build and publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      # TODO: check the tag against the project's version file, run tests, and build.
      - name: Build
        run: |
          mkdir -p dist
          echo "Replace this step with the project's build" > dist/README.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --title "${GITHUB_REPOSITORY#*/} ${RELEASE_TAG#v}" \
            --verify-tag \
            --generate-notes
